name: Koffie Financial
description: 'Koffie Financial (originally Koffie Labs) was a New York based insurtech managing general
  agency selling commercial trucking insurance to fleets, brokers and agents. Founded by co-founder and
  CEO Ian White and co-founder and COO Michael Dorfman, it paired telematics driven underwriting with
  digital policy servicing, partnering with Samsara on fleet safety data, Sutton National and Boost on
  underwriting capacity, and Snapsheet on claims. It raised a 4.5 million dollar seed in 2021 and an 11
  million dollar Series A in 2022 led by Anthemis Group, rebranded from Koffie Labs to Koffie Financial,
  launched the Koffie Card, and was licensed in states including New York, Georgia, Florida and Tennessee.
  The company never published a public developer program, API documentation, OpenAPI, or SDKs; its only
  machine surfaces were private broker and fleet portals. As of July 2026 its web presence is retired.'
